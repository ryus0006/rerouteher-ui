server {
    # Iteration 2 uses 5174 end-to-end so the deployment proxy and container agree.
    listen 0.0.0.0:5174;
    listen [::]:5174;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Leave room for multipart boundaries around the API's 10 MB CV upload.
    client_max_body_size 11m;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Proxy API calls to the backend service (same-origin /api, no CORS).
    # `api` is the backend's network alias and 8080 its port; adjust to the deployment.
    location /api/ {
        # Resolve the backend at request time via Docker's embedded DNS so nginx still
        # starts if the backend is not reachable yet; a literal upstream aborts boot.
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $backend_upstream http://api:8080;
        # $request_uri keeps the /api prefix, so /api/cv/parse -> backend /api/cv/parse.
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Hashed filenames are safe to cache indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: unknown paths render the app, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
